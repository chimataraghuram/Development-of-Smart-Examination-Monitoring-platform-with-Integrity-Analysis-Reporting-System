<!DOCTYPE html>
<html>
<head>
<title>Event Logs</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container" style="max-width:900px;">

<h2>Event Logs</h2>

<table>

<tr>
<th>Candidate ID</th>
<th>Event</th>
<th>Timestamp</th>
<th>Remarks</th>
</tr>

{% for log in logs %}
<tr>
<td>{{log[0]}}</td>
<td>{{log[1]}}</td>
<td>{{log[2]}}</td>
<td>{{log[3]}}</td>
</tr>
{% endfor %}

</table>

</div>

</body>
</html>
