<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ExamMonitor · Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #a7afcc );
            background-size: 400% 400%;
            animation: gradientShift 18s ease infinite;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            z-index: 0;
            opacity: 0.4;
            animation: orbFloat 20s infinite alternate ease-in-out;
        }
        .orb--1 { width: 400px; height: 400px; background: #6c3ce0; top: -120px; left: -120px; }
        .orb--2 { width: 500px; height: 500px; background: #1e88e5; bottom: -180px; right: -180px; animation-delay: 4s; }
        .orb--3 { width: 300px; height: 300px; background: #7c4dff; top: 50%; left: 60%; animation-delay: 8s; opacity: 0.25; }

        @keyframes orbFloat {
            0% { transform: translate(0,0) scale(1); }
            33% { transform: translate(40px,-30px) scale(1.1); }
            66% { transform: translate(-20px,40px) scale(0.9); }
            100% { transform: translate(30px,20px) scale(1.05); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            background: rgba(20, 20, 50, 0.85);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            border-radius: 40px;
            padding: 44px 36px 48px;
            box-shadow: 0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 100px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.1);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .brand-icon {
            width: 48px; height: 48px;
            background: linear-gradient(135deg, #7c4dff, #448aff);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            color: #fff;
            box-shadow: 0 8px 24px rgba(124,77,255,0.35);
        }
        .brand-text {
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #f0f0ff, #b8aaff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .brand-sub {
            font-size: 13px;
            color: rgba(255,255,255,0.4);
            font-weight: 400;
            margin-top: 2px;
            letter-spacing: 0.3px;
            -webkit-text-fill-color: rgba(255,255,255,0.4);
        }

        .welcome {
            font-size: 20px;
            font-weight: 600;
            color: #f0f0ff;
            margin-bottom: 6px;
        }
        .welcome-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.35);
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 22px;
            position: relative;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: rgba(255,255,255,0.6);
            margin-bottom: 6px;
            letter-spacing: 0.3px;
        }
        .form-group .input-wrap {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.04);
            border-radius: 14px;
            border: 1.5px solid rgba(255,255,255,0.06);
            transition: border-color 0.3s, background 0.3s, box-shadow 0.3s;
        }
        .form-group .input-wrap:focus-within {
            border-color: #7c4dff;
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 0 4px rgba(124,77,255,0.12);
        }
        .form-group .input-wrap .icon {
            padding: 0 0 0 16px;
            color: rgba(255,255,255,0.25);
            font-size: 15px;
            transition: color 0.3s;
        }
        .form-group .input-wrap:focus-within .icon {
            color: #7c4dff;
        }
        .form-group .input-wrap input {
            width: 100%;
            padding: 14px 16px 14px 12px;
            background: transparent;
            border: none;
            outline: none;
            color: #f0f0ff;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            letter-spacing: 0.2px;
        }
        .form-group .input-wrap input::placeholder {
            color: rgba(255,255,255,0.2);
            font-weight: 400;
            font-size: 14px;
        }
        .form-group .input-wrap.error {
            border-color: #ff6b6b;
            background: rgba(255,107,107,0.05);
        }
        .form-group .input-wrap.error:focus-within {
            box-shadow: 0 0 0 4px rgba(255,107,107,0.15);
        }
        .form-group .hint {
            font-size: 11px;
            color: rgba(255,255,255,0.25);
            margin-top: 6px;
            padding-left: 4px;
            transition: color 0.3s;
        }
        .form-group .hint.error-hint {
            color: #ff6b6b;
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 60px;
            font-size: 16px;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: #fff;
            background: linear-gradient(135deg, #7c4dff, #448aff);
            cursor: pointer;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px rgba(124,77,255,0.3);
            margin-top: 6px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn-login:hover {
            transform: translateY(-2px) scale(1.01);
            box-shadow: 0 14px 44px rgba(124,77,255,0.45);
        }
        .btn-login:active {
            transform: translateY(0) scale(0.98);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-outline {
            width: 100%;
            padding: 14px;
            border: 1.5px solid rgba(255,255,255,0.12);
            border-radius: 60px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            color: rgba(255,255,255,0.6);
            background: transparent;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-outline:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.25);
            color: #fff;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 22px 0 10px;
        }
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255,255,255,0.06);
        }
        .divider span {
            font-size: 12px;
            color: rgba(255,255,255,0.2);
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: rgba(20,12,50,0.92);
            backdrop-filter: blur(16px);
            padding: 14px 32px;
            border-radius: 60px;
            border: 1px solid rgba(255,255,255,0.06);
            color: #fff;
            font-weight: 500;
            font-size: 14px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.5);
            z-index: 999;
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
            pointer-events: auto;
        }
        .toast.success { border-color: rgba(81,207,102,0.3); }
        .toast.error { border-color: rgba(255,107,107,0.3); }
        .toast i { font-size: 18px; }
        .toast.success i { color: #51cf66; }
        .toast.error i { color: #ff6b6b; }

        @media (max-width: 520px) {
            .login-card { padding: 28px 20px 32px; border-radius: 28px; }
            .brand-text { font-size: 22px; }
            .welcome { font-size: 18px; }
            .form-group .input-wrap input { font-size: 14px; padding: 12px 14px 12px 10px; }
            .btn-login { font-size: 15px; padding: 14px; }
            .btn-outline { font-size: 14px; padding: 12px; }
            .toast { font-size: 13px; padding: 12px 20px; max-width: 90%; }
        }
        @media (max-width: 380px) {
            .brand-icon { width: 40px; height: 40px; font-size: 18px; }
            .brand-text { font-size: 19px; }
            .login-card { padding: 20px 14px 24px; }
        }
    
        /* Autofill override fix (removes the ugly white background on login/register inputs) */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active {
            transition: background-color 5000s ease-in-out 0s !important;
            -webkit-text-fill-color: #f0f0ff !important;
        }

    </style>
</head>
<body>

    <div class="orb orb--1"></div>
    <div class="orb orb--2"></div>
    <div class="orb orb--3"></div>

    <div id="toast" class="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMsg">Welcome back!</span>
    </div>

    <div class="login-card">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
            <div>
                <div class="brand-text">ExamMonitor</div>
                <div class="brand-sub">secure · smart · seamless</div>
            </div>
        </div>

        <div class="welcome">Welcome back</div>
        <div class="welcome-sub">Sign in to continue your exam session</div>

        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="loginEmail"><i class="fas fa-envelope" style="margin-right:6px;color:rgba(255,255,255,0.3);"></i>Email</label>
                <div class="input-wrap" id="loginEmailWrap">
                    <span class="icon"><i class="fas fa-envelope"></i></span>
                    <input type="email" id="loginEmail" placeholder="you@gmail.com" autocomplete="email" />
                </div>
                <div class="hint" id="loginEmailHint">Must be @gmail.com</div>
            </div>

            <div class="form-group">
                <label for="loginPassword"><i class="fas fa-lock" style="margin-right:6px;color:rgba(255,255,255,0.3);"></i>Password</label>
                <div class="input-wrap" id="loginPasswordWrap">
                    <span class="icon"><i class="fas fa-lock"></i></span>
                    <input type="password" id="loginPassword" placeholder="••••••" maxlength="6" autocomplete="current-password" />
                </div>
                <div class="hint" id="loginPasswordHint">Exactly 6 characters</div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <i class="fas fa-sign-in-alt"></i> Sign In
            </button>
        </form>

        <div class="divider"><span>or</span></div>

        <button id="createAccountBtn" class="btn-outline">
            <i class="fas fa-user-plus"></i> Create Account
        </button>
    </div>

    <script>
        (function() {
            'use strict';

            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('loginEmail');
            const passwordInput = document.getElementById('loginPassword');
            const emailWrap = document.getElementById('loginEmailWrap');
            const passWrap = document.getElementById('loginPasswordWrap');
            const emailHint = document.getElementById('loginEmailHint');
            const passHint = document.getElementById('loginPasswordHint');
            const loginBtn = document.getElementById('loginBtn');
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const createBtn = document.getElementById('createAccountBtn');

            function showToast(msg, type = 'success') {
                toast.className = 'toast ' + type;
                toastMsg.textContent = msg;
                const icon = toast.querySelector('i');
                icon.className = type === 'success' ? 'fas fa-check-circle' : 'fas fa-exclamation-circle';
                toast.classList.add('show');
                clearTimeout(toast._timer);
                toast._timer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 3500);
            }

            function setFieldState(wrap, hint, ok, errMsg) {
                wrap.classList.remove('error');
                hint.classList.remove('error-hint');
                if (ok === false) {
                    wrap.classList.add('error');
                    hint.classList.add('error-hint');
                    hint.textContent = errMsg || 'Invalid';
                } else {
                    hint.classList.remove('error-hint');
                    hint.textContent = errMsg || '';
                }
            }

            function validateEmail(val) {
                if (!val || !val.endsWith('@gmail.com') || val.length < 11) {
                    return { ok: false, msg: 'Must be @gmail.com' };
                }
                return { ok: true, msg: '' };
            }

            function validatePassword(val) {
                if (!val || val.length !== 6) {
                    return { ok: false, msg: 'Exactly 6 characters' };
                }
                return { ok: true, msg: '' };
            }

            // Real-time validation
            emailInput.addEventListener('input', function() {
                const res = validateEmail(this.value);
                setFieldState(emailWrap, emailHint, res.ok, res.msg);
            });

            passwordInput.addEventListener('input', function() {
                this.value = this.value.slice(0, 6);
                const res = validatePassword(this.value);
                setFieldState(passWrap, passHint, res.ok, res.msg);
            });

            // Login submit
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const email = emailInput.value.trim();
                const password = passwordInput.value;

                const emailRes = validateEmail(email);
                const passRes = validatePassword(password);

                setFieldState(emailWrap, emailHint, emailRes.ok, emailRes.msg);
                setFieldState(passWrap, passHint, passRes.ok, passRes.msg);

                if (!emailRes.ok || !passRes.ok) {
                    showToast('Please enter valid credentials.', 'error');
                    return;
                }

                loginBtn.disabled = true;
                loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Signing In...';

                fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',  // <-- crucial for session cookies
                    body: JSON.stringify({ email, password })
                })
                .then(res => {
                    if (!res.ok) {
                        return res.json().then(data => {
                            throw new Error(data.error || 'Login failed');
                        });
                    }
                    return res.json();
                })
                .then(data => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';

                    showToast(`Welcome back, ${data.name}!`, 'success');

                    // Redirect based on role
                    const redirectUrl = data.role === 'admin' ? '/admin_dashboard' : '/dashboard';
                    setTimeout(() => {
                        window.location.href = redirectUrl;
                    }, 800);
                })
                .catch(err => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
                    showToast(err.message || 'Network error', 'error');
                });
            });

            // Create account button
            createBtn.addEventListener('click', function() {
                window.location.href = '/register';
            });

            // Set default hints
            emailHint.textContent = 'Must be @gmail.com';
            passHint.textContent = 'Exactly 6 characters';
        })();
    </script>

</body>
</html>
